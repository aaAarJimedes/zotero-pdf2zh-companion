name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run smoke tests
        run: node .\tests\smoke.js
      - name: Build XPI
        shell: pwsh
        run: .\build.ps1
      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf2zh-companion-release
          path: |
            dist\*.xpi
            dist\updates.json
